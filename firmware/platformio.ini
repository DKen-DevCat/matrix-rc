; 機体（Seeed XIAO ESP32S3 Sense）のビルド設定。
;   pio run -t upload && pio device monitor
; 判断ロジックのテストは PC 上で `make test`（lib/core はハードに依存しない）。
[env:xiao]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi   ; 8MB の PSRAM（カメラのフレームバッファ用）
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -std=gnu++17
build_unflags = -std=gnu++11
