; 機体（Seeed XIAO ESP32S3 Sense）のビルド設定。
;   pio run -t upload && pio device monitor
; 判断ロジックのテストは PC 上で `make test`（lib/core はハードに依存しない）。
[env:xiao]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi   ; 8MB の PSRAM（カメラのフレームバッファ用）
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -std=gnu++17
build_unflags = -std=gnu++11

; Phase 1-b：走行モーターを Pololu 136:1 6mm 遊星（6V 定格）にした機体。1S の電池で回すので速度の上限を 1.0 にする
;   pio run -e xiao_1b -t upload
[env:xiao_1b]
extends = env:xiao
build_flags =
  ${env:xiao.build_flags}
  -DMATRIX_MAX_DUTY=1.0f
