<text x="804" y="727" font-size="10" text-anchor="start" font-weight="normal" fill="#6b7280">単位</text>
<text x="866" y="739" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933">mm</text>
<text x="914" y="694" font-size="10" text-anchor="start" font-weight="normal" fill="#6b7280">遠隔操作チョロQ</text>
<text x="914" y="713" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">運用配置図（中継ペア）</text>
<text x="914" y="737" font-size="11" text-anchor="start" font-weight="normal" fill="#6b7280">尺度 NTS（尺度なし）   作成 2026-10-25</text>
