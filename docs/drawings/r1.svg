<line x1="230" y1="156" x2="910" y2="480" stroke="#d64545" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrr)"/>
<rect x="445.6" y="346.0" width="168.8" height="16.799999999999997" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="530.0" y="358.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#d64545">LTE 弱い（壁・床すれすれ）</text>
<rect x="30" y="668" width="640" height="66.0" rx="6" fill="#fffbea" stroke="#e0b100" stroke-width="1.2" fill-opacity="1"/>
<text x="42" y="688" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933">運用</text>
<text x="42" y="708.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・B が近いほど A の操作が軽くなる。B が離れても A 自身の LTE で動き続ける（切り替えの瞬間はない）。</text>
<text x="42" y="726.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・2台はまったく同じハード。役割（中継役／探索役）は操作画面から切り替える。</text>
