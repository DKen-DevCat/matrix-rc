<text x="740" y="207" font-size="11" text-anchor="start" font-weight="normal" fill="#6b7280">入口の外側に停車・LTE 良好</text>
<rect x="912" y="464" width="56" height="32" rx="6" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2" fill-opacity="1"/>
<text x="940" y="485" font-size="15" text-anchor="middle" font-weight="bold" fill="#3b6fd8">A</text>
