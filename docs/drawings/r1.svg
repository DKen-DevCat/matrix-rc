<text x="495" y="418" font-size="10" text-anchor="middle" font-weight="normal" fill="#6b7280">棚</text>
<rect x="672" y="176" width="56" height="32" rx="6" fill="#fff1e0" stroke="#d9822b" stroke-width="2" fill-opacity="1"/>
