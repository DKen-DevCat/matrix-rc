<text x="24" y="38" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2933">R1  運用配置図 ― 中継ペアモデル（Phase 2）</text>
<text x="24" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">2台を同じハードで作り、片方（B）を電波の良い入口に停めて中継役にする。もう片方（A）が店の奥へ入る</text>
