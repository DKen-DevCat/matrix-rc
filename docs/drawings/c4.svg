<text x="24" y="38" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2933">C4  ジャンプ機構図 ― 渦巻きカム式</text>
<text x="24" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">高減速モーターでカムをゆっくり回してばねを縮め、カムの段差で一気に放す。サーボより力が出せ、1方向に回すだけで済む</text>
