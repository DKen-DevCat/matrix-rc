<text x="645" y="390.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">上段（電子部品・電池）</text>
<polyline points="540,430.0 540,430.8333333333333 549,431.66666666666663 531,432.49999999999994 549,433.33333333333326 531,434.1666666666666 549,434.9999999999999 531,435.8333333333332 549,436.6666666666665 531,437.49999999999983 549,438.33333333333314 531,439.16666666666646 540,439.1666666666667 540,440" fill="none" stroke="#7c4dd6" stroke-width="1.8" stroke-linejoin="round"/>
