<line x1="502" y1="470" x2="518" y2="470" stroke="#868e96" stroke-width="3"/>
<g transform="rotate(300 645 460)"><path d="M645,452 A8,8 0 0 1 653,460 A12,12 0 0 1 645,472 A15,15 0 0 1 630,460 A18,18 0 0 1 645,442 Z" fill="#fde2e2" stroke="#d64545" stroke-width="1.8"/></g>
<circle cx="645" cy="460" r="3" fill="#d64545" stroke="#d64545" stroke-width="1.4"/>
<polyline points="675,430.0 675,484 647,484" fill="none" stroke="#d9822b" stroke-width="2.4" stroke-linejoin="round"/>
<circle cx="647" cy="479" r="5" fill="#fff" stroke="#d9822b" stroke-width="1.8"/>
<line x1="790" y1="320.0" x2="790" y2="354.0" stroke="#d64545" stroke-width="2.5" marker-end="url(#arrr)"/>
<rect x="718.5" y="303.0" width="63" height="15.399999999999999" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="750" y="314.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#d64545">引き下げる</text>
<text x="645" y="555" font-size="11" text-anchor="middle" font-weight="normal" fill="#6b7280">カムが太る側でフォロワーを押し下げ、ばねを縮める</text>
<rect x="860" y="100" width="390" height="470" rx="10" fill="#ffffff" stroke="#868e96" stroke-width="1.2" fill-opacity="1"/>
<text x="876" y="128" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">③ 解放 → 跳躍</text>
<line x1="880" y1="520" x2="1230" y2="520" stroke="#1f2933" stroke-width="1.2"/>
<rect x="880" y="520" width="350" height="8" fill="url(#hatch)"/>
<circle cx="940" cy="426" r="34" fill="#4b5563" stroke="#1f2933" stroke-width="1.4"/>
<circle cx="940" cy="426" r="18.700000000000003" fill="#d1d5db" stroke="#1f2933" stroke-width="1"/>
<circle cx="940" cy="426" r="2.2" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
<circle cx="1170" cy="426" r="34" fill="#4b5563" stroke="#1f2933" stroke-width="1.4"/>
<circle cx="1170" cy="426" r="18.700000000000003" fill="#d1d5db" stroke="#1f2933" stroke-width="1"/>
<circle cx="1170" cy="426" r="2.2" fill="#1f2933" stroke="#1f2933" stroke-width="1"/>
<rect x="900" y="380" width="310" height="40" rx="4" fill="#e5e7eb" stroke="#1f2933" stroke-width="1.5" fill-opacity="1"/>
<text x="1055" y="406" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">下段</text>
<rect x="890" y="250" width="330" height="70" rx="6" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.8" fill-opacity="1"/>
<text x="1055" y="280" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2933">上段（電子部品・電池）</text>
<polyline points="950,320 950,325.0 959,330.0 941,335.0 959,340.0 941,345.0 959,350.0 941,355.0 959,360.0 941,365.0 959,370.0 941,375.0 950,375.0 950,380" fill="none" stroke="#7c4dd6" stroke-width="1.8" stroke-linejoin="round"/>
