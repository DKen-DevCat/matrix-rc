<text x="905.0" y="450.275" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">状態LED WS2812B</text>
<text x="905.0" y="469.5249999999999" font-size="11" text-anchor="middle" font-weight="normal" fill="#374151">撮影中・経路・電池</text>
