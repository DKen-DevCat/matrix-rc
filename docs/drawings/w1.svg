<text x="24" y="38" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2933">W1  システム構成図 ― Wi-Fiモデル（Phase 1-a）</text>
<text x="24" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">自宅のWi-Fiだけで、PCのキー操作 → 機体の走行・ジャンプ → 映像・音声の返送までを一通り通す</text>
<rect x="30" y="100" width="470" height="330" rx="12" fill="#fafbff" stroke="#3b6fd8" stroke-width="1.4" stroke-dasharray="7 5" fill-opacity="1"/>
<text x="46" y="124" font-size="14" text-anchor="start" font-weight="bold" fill="#3b6fd8">操作用PC（自宅）</text>
<rect x="50" y="145" width="200" height="250" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5" fill-opacity="1"/>
<text x="150.0" y="226.375" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933">ブラウザ（操作画面）</text>
<text x="150.0" y="248.37499999999997" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">W/A/S/D・Space を検出</text>
<text x="150.0" y="267.22499999999997" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">押下状態を 50Hz で送信</text>
<text x="150.0" y="286.075" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">映像・音声を再生</text>
<text x="150.0" y="304.92499999999995" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">ラグ・電池・経路を表示</text>
<text x="150.0" y="323.775" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">雑音除去（任意）</text>
<rect x="280" y="145" width="200" height="250" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5" fill-opacity="1"/>
<text x="380.0" y="226.375" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933">中継サーバ</text>
<text x="380.0" y="248.37499999999997" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">Node.js（同じPCで起動）</text>
<text x="380.0" y="267.22499999999997" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">ブラウザ ⇄ 機体を中継</text>
<text x="380.0" y="286.075" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">共有トークンで認証</text>
<text x="380.0" y="304.92499999999995" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">往復遅延の計測・記録</text>
<text x="380.0" y="323.775" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">経路を複数持てる作り</text>
