<line x1="1105" y1="430" x2="1105" y2="410" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="1112" y="424" font-size="10" text-anchor="start" font-weight="normal" fill="#6b7280">カムで押す</text>
<rect x="30" y="455" width="740" height="102.0" rx="6" fill="#fffbea" stroke="#e0b100" stroke-width="1.2" fill-opacity="1"/>
<text x="42" y="475" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933">設計のポイント</text>
<text x="42" y="495.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・機体は自分からサーバへ接続する（機体側で待ち受けない）。1-b でもこの形を変えない。</text>
<text x="42" y="513.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・操作は「今押されているキー」を 50Hz で送り続ける。300ms 届かなければ機体が自分で停止する。</text>
<text x="42" y="531.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・1-b では「自宅Wi-Fi＋PC内サーバ」を「LTE＋東京のVPS」に差し替えるだけで済む作りにする。</text>
<text x="42" y="549.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・電池は保護回路付きリポ 1S 1000mAh。ブザーの代わりに走行モーターを鳴らして音を出す。</text>
