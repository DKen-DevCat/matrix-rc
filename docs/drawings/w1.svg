<text x="905.0" y="329.5249999999999" font-size="11" text-anchor="middle" font-weight="normal" fill="#374151">モータードライバ</text>
<rect x="820" y="360" width="170" height="50" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5" fill-opacity="1"/>
<text x="905.0" y="380.275" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">走行モーター ×2</text>
<text x="905.0" y="399.5249999999999" font-size="11" text-anchor="middle" font-weight="normal" fill="#374151">N20 約300rpm</text>
<rect x="1020" y="290" width="170" height="50" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5" fill-opacity="1"/>
