<text x="1105.0" y="329.5249999999999" font-size="11" text-anchor="middle" font-weight="normal" fill="#374151">一方向スイッチ</text>
<rect x="1020" y="360" width="170" height="50" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5" fill-opacity="1"/>
<text x="1105.0" y="380.275" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">ジャンプ用モーター</text>
<text x="1105.0" y="399.5249999999999" font-size="11" text-anchor="middle" font-weight="normal" fill="#374151">N20 高減速＋渦巻きカム</text>
<rect x="1020" y="430" width="170" height="50" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5" fill-opacity="1"/>
<text x="1105.0" y="450.275" font-size="13" text-anchor="middle" font-weight="bold" fill="#1f2933">カム位置スイッチ</text>
<text x="1105.0" y="469.5249999999999" font-size="11" text-anchor="middle" font-weight="normal" fill="#374151">縮みきりを検知</text>
