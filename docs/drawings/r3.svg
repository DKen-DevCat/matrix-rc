<text x="110" y="104" font-size="13" text-anchor="middle" font-weight="bold" fill="#3b6fd8">操作用PC</text>
<line x1="110" y1="116" x2="110" y2="760" stroke="#868e96" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="285" y="80" width="150" height="36" rx="6" fill="#fff" stroke="#3b6fd8" stroke-width="1.6" fill-opacity="1"/>
<text x="360" y="104" font-size="13" text-anchor="middle" font-weight="bold" fill="#3b6fd8">中継サーバ</text>
