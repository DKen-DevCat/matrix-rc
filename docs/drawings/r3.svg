<text x="24" y="38" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2933">R3  シーケンス図 ― 中継ペアモデル</text>
<text x="24" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">B が近いとき・B が離れたとき・どの経路も途絶えたとき の3場面。経路を切り替える処理はどこにもない</text>
