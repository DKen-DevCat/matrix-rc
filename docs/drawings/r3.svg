<text x="500.0" y="199" font-size="11" text-anchor="middle" font-weight="normal" fill="#2f9e57">seq=101（LTE）</text>
<line x1="640" y1="230" x2="950" y2="230" stroke="#7c4dd6" stroke-width="1.8"/>
<rect x="733.8" y="213" width="122.39999999999999" height="15.399999999999999" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="795.0" y="224" font-size="11" text-anchor="middle" font-weight="normal" fill="#7c4dd6">seq=101（ESP-NOW）</text>
<polygon points="942,224 954,230 942,236" fill="#7c4dd6"/>
<text x="960" y="234" font-size="11" text-anchor="start" font-weight="normal" fill="#2f9e57">45ms で到着 → 採用</text>
<line x1="360" y1="290" x2="950" y2="290" stroke="#d64545" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrr)"/>
