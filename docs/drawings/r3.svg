<text x="655.0" y="284" font-size="11" text-anchor="middle" font-weight="normal" fill="#d64545">seq=101（A の LTE・遅い）</text>
<text x="960" y="294" font-size="11" text-anchor="start" font-weight="normal" fill="#d64545">180ms で到着 → 重複なので捨てる</text>
