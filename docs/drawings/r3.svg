<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
