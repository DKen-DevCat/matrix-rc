<text x="235.0" y="404" font-size="11" text-anchor="middle" font-weight="normal" fill="#3b6fd8">seq=102</text>
<line x1="360" y1="435" x2="640" y2="435" stroke="#2f9e57" stroke-width="1.8" marker-end="url(#arrg)"/>
<rect x="472.9" y="418" width="54.199999999999996" height="15.399999999999999" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="500.0" y="429" font-size="11" text-anchor="middle" font-weight="normal" fill="#2f9e57">seq=102</text>
<line x1="640" y1="460" x2="780" y2="460" stroke="#7c4dd6" stroke-width="1.8" stroke-dasharray="3 3"/>
<text x="790" y="465" font-size="12" text-anchor="start" font-weight="bold" fill="#d64545">✕ 届かない</text>
<line x1="360" y1="495" x2="950" y2="495" stroke="#d64545" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrr)"/>
<rect x="591.6" y="478" width="126.8" height="15.399999999999999" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="655.0" y="489" font-size="11" text-anchor="middle" font-weight="normal" fill="#d64545">seq=102（A の LTE）</text>
<text x="960" y="499" font-size="11" text-anchor="start" font-weight="normal" fill="#d9822b">180ms で到着 → 採用（ラグが戻るだけ）</text>
<rect x="20" y="550" width="1200" height="190" rx="6" fill="#fdf2f2" stroke="#d64545" stroke-width="0.8" stroke-dasharray="4 3" fill-opacity="1"/>
<text x="32" y="570" font-size="12" text-anchor="start" font-weight="bold" fill="#d64545">場面3：どの経路も途絶えた</text>
<line x1="110" y1="600" x2="360" y2="600" stroke="#3b6fd8" stroke-width="1.8" marker-end="url(#arrb)"/>
<rect x="207.9" y="583" width="54.199999999999996" height="15.399999999999999" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="235.0" y="594" font-size="11" text-anchor="middle" font-weight="normal" fill="#3b6fd8">seq=103</text>
<line x1="360" y1="625" x2="560" y2="625" stroke="#d64545" stroke-width="1.8" stroke-dasharray="3 3"/>
<text x="570" y="630" font-size="13" text-anchor="start" font-weight="bold" fill="#d64545">✕</text>
<line x1="360" y1="650" x2="760" y2="650" stroke="#d64545" stroke-width="1.8" stroke-dasharray="3 3"/>
<text x="770" y="655" font-size="13" text-anchor="start" font-weight="bold" fill="#d64545">✕</text>
<rect x="880" y="670" width="300" height="56" rx="6" fill="#fdecec" stroke="#d64545" stroke-width="1.5" fill-opacity="1"/>
<text x="1030" y="693" font-size="12" text-anchor="middle" font-weight="bold" fill="#d64545">最後の受信から 300ms → 自分で停止</text>
<text x="1030" y="712" font-size="11" text-anchor="middle" font-weight="normal" fill="#d64545">LED 赤点滅・モーターで警告音</text>
<line x1="950" y1="610" x2="950" y2="670" stroke="#d64545" stroke-width="3"/>
<rect x="796" y="760" width="430" height="66" rx="0" fill="#fff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<line x1="906" y1="760" x2="906" y2="826" stroke="#1f2933" stroke-width="0.8"/>
<line x1="796" y1="793" x2="906" y2="793" stroke="#1f2933" stroke-width="0.8"/>
<line x1="906" y1="800" x2="1226" y2="800" stroke="#1f2933" stroke-width="0.8"/>
<text x="804" y="774" font-size="10" text-anchor="start" font-weight="normal" fill="#6b7280">図番</text>
<text x="851" y="787" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933">R3</text>
<text x="804" y="807" font-size="10" text-anchor="start" font-weight="normal" fill="#6b7280">単位</text>
<text x="866" y="819" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933">mm</text>
