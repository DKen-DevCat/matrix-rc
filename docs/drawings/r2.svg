<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker>
<marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e57"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
<marker id="dim" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#6b7280"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#868e96" stroke-width="1"/></pattern>
</defs>
<text x="24" y="38" font-size="22" text-anchor="start" font-weight="bold" fill="#1f2933">R2  通信経路図 ― 中継ペアモデル</text>
<text x="24" y="62" font-size="13" text-anchor="start" font-weight="normal" fill="#6b7280">同じ操作パケットを「A の LTE」と「B 経由」の両方に流し、受け手が先に届いた方を使う（重複は捨てる）</text>
<rect x="30" y="230" width="190" height="150" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5" fill-opacity="1"/>
<text x="125.0" y="280.225" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933">操作用PC</text>
<text x="125.0" y="302.225" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">ブラウザ</text>
<text x="125.0" y="321.075" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">（1人で A/B 切替</text>
<text x="125.0" y="339.925" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151"> または 2人で分担）</text>
<rect x="300" y="200" width="230" height="210" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5" fill-opacity="1"/>
<text x="415.0" y="270.8" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933">中継サーバ（VPS）</text>
<text x="415.0" y="292.8" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">機体ごとに経路を複数保持</text>
<text x="415.0" y="311.65" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">下り：全経路に同じ命令</text>
<text x="415.0" y="330.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">上り：連番で先着採用</text>
<text x="415.0" y="349.34999999999997" font-size="13" text-anchor="middle" font-weight="normal" fill="#374151">経路ごとの遅延を表示</text>
<line x1="220" y1="280" x2="300" y2="280" stroke="#3b6fd8" stroke-width="2" marker-end="url(#arrb)"/>
<line x1="300" y1="330" x2="220" y2="330" stroke="#3b6fd8" stroke-width="2" marker-end="url(#arrb)"/>
<rect x="700" y="110" width="220" height="130" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="1.5" fill-opacity="1"/>
<text x="810.0" y="152.4" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933">機体B（中継役）</text>
<text x="810.0" y="173.3" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">LTE 良好</text>
<text x="810.0" y="190.7" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">A の分も中継する</text>
<text x="810.0" y="208.1" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">自分は停車・映像は任意</text>
<rect x="980" y="330" width="230" height="170" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5" fill-opacity="1"/>
<text x="1095.0" y="383.7" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933">機体A（探索役）</text>
<text x="1095.0" y="404.59999999999997" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">2経路で受信し連番で</text>
<text x="1095.0" y="422.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">先着採用・重複破棄</text>
<text x="1095.0" y="439.4" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">300ms どの経路からも</text>
<text x="1095.0" y="456.8" font-size="12" text-anchor="middle" font-weight="normal" fill="#374151">届かなければ停止</text>
<polyline points="530,380 620,380 620,450 980,450" fill="none" stroke="#d64545" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
<rect x="660.4" y="428" width="279.2" height="16.799999999999997" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="800" y="440" font-size="12" text-anchor="middle" font-weight="normal" fill="#d64545">経路①  A の LTE（弱い・遅い：100〜300ms）</text>
<polyline points="530,250 600,250 600,175 700,175" fill="none" stroke="#2f9e57" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrg)"/>
<rect x="611.8" y="154" width="56.4" height="15.399999999999999" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="640" y="165" font-size="11" text-anchor="middle" font-weight="normal" fill="#2f9e57">LTE 良好</text>
<polyline points="920,175 1095,175 1095,330" fill="none" stroke="#7c4dd6" stroke-width="2.6" stroke-linejoin="round"/>
<polygon points="1089,318 1101,318 1095,330" fill="#7c4dd6"/>
<rect x="955.6" y="153" width="108.8" height="16.799999999999997" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="1010" y="165" font-size="12" text-anchor="middle" font-weight="bold" fill="#7c4dd6">ESP-NOW（数ms）</text>
<rect x="714.0" y="278" width="212.0" height="16.799999999999997" rx="3" fill="#ffffff" fill-opacity="0.95"/>
<text x="820" y="290" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f9e57">経路②  B 経由（速い：40〜80ms）</text>
<rect x="30" y="520" width="760" height="150" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="1.2" fill-opacity="1"/>
<text x="46" y="545" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933">操作パケット（全経路共通・約 32 バイト）</text>
<rect x="46" y="562" width="70" height="40" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="81.0" y="587" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2933">機体ID</text>
<rect x="116" y="562" width="100" height="40" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="166.0" y="587" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2933">連番 seq</text>
<rect x="216" y="562" width="100" height="40" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="266.0" y="587" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2933">送信時刻</text>
<rect x="316" y="562" width="170" height="40" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="401.0" y="587" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2933">キー W/A/S/D/Space</text>
<rect x="486" y="562" width="100" height="40" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="536.0" y="587" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2933">ジャンプID</text>
<rect x="586" y="562" width="180" height="40" rx="0" fill="#ffffff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<text x="676.0" y="587" font-size="11" text-anchor="middle" font-weight="normal" fill="#1f2933">認証タグ（AES-GCM）</text>
<text x="46" y="625" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933">・受け手は「最後に採用した seq より新しいものだけ」使う → 二重に届いても1回分しか効かない（古い命令の再送も拒否）。</text>
<text x="46" y="645" font-size="11" text-anchor="start" font-weight="normal" fill="#1f2933">・ジャンプは ジャンプID で1回だけ実行。B は中身を復号せず、そのまま転送する（B が乗っ取られても命令を偽造できない）。</text>
<rect x="796" y="620" width="430" height="66" rx="0" fill="#fff" stroke="#1f2933" stroke-width="1.2" fill-opacity="1"/>
<line x1="906" y1="620" x2="906" y2="686" stroke="#1f2933" stroke-width="0.8"/>
<line x1="796" y1="653" x2="906" y2="653" stroke="#1f2933" stroke-width="0.8"/>
<line x1="906" y1="660" x2="1226" y2="660" stroke="#1f2933" stroke-width="0.8"/>
<text x="804" y="634" font-size="10" text-anchor="start" font-weight="normal" fill="#6b7280">図番</text>
<text x="851" y="647" font-size="14" text-anchor="middle" font-weight="bold" fill="#1f2933">R2</text>
<text x="804" y="667" font-size="10" text-anchor="start" font-weight="normal" fill="#6b7280">単位</text>
<text x="866" y="679" font-size="12" text-anchor="middle" font-weight="normal" fill="#1f2933">mm</text>
<text x="914" y="634" font-size="10" text-anchor="start" font-weight="normal" fill="#6b7280">遠隔操作チョロQ</text>
<text x="914" y="653" font-size="15" text-anchor="start" font-weight="bold" fill="#1f2933">通信経路図（中継ペア）</text>
<text x="914" y="677" font-size="11" text-anchor="start" font-weight="normal" fill="#6b7280">尺度 NTS（尺度なし）   作成 2026-10-25</text>
</svg>