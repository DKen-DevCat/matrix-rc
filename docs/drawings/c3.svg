<text x="652" y="438" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933">設計メモ（2026-10-29：車輪 φ32・電池 LP603449）</text>
<text x="652" y="458.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・走行モーター（Pololu 6mm 遊星、長さ 19）は左右一直線、後輪を揃える。前輪は自由回転。</text>
<text x="652" y="476.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・重い部品（電池・LTE）は上段に載せる。上段が重いほど高く跳べる。</text>
<text x="652" y="494.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・上段と下段はガイドピン（M2 ねじ）で上下だけ動く。ばねとピンは四隅（板の裏の電池と車輪を避ける）。</text>
<text x="652" y="512.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・重さは約 110g（部品の型番で見直した内訳は設計書②の重量表）。</text>
<text x="652" y="530.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・上下のすき間 21mm は縮めると 11mm（縮めた上段の下面 34mm がタイヤ上端 32mm に当たらない）。</text>
<text x="652" y="548.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">  10mm リフトのカム（直径 30mm 級）の収まり場所は未確定。1-b2 で「縮めた状態」の側面図で確定。</text>
