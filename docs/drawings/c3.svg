<text x="652" y="438" font-size="13" text-anchor="start" font-weight="bold" fill="#1f2933">設計メモ</text>
<text x="652" y="458.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・左右の走行モーターは前後にずらして置く（2個を一直線に並べると幅が足りない）。</text>
<text x="652" y="476.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・重い部品（電池・LTE）は上段に載せる。上段が重いほど高く跳べる。</text>
<text x="652" y="494.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・前輪は自由回転。左右の回転差で向きを変える（スキッドステア）。</text>
<text x="652" y="512.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・上段と下段はガイドピン（M2 ねじ）で上下だけ動く。ねじの頭が伸びきりのストッパー。</text>
<text x="652" y="530.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・目標の重さは約 100g（内訳は設計書②の重量表）。</text>
<text x="652" y="548.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">・上下のすき間 18mm は縮めると 8mm（縮めた上段がタイヤに当たらない高さ。10-28 に 6mm 上げた）。</text>
<text x="652" y="566.0" font-size="12" text-anchor="start" font-weight="normal" fill="#374151">  10mm リフトのカム（直径 30mm 級）の収まり場所は未確定。1-b2 で「縮めた状態」の側面図で確定。</text>
