<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>matrix-rc 高画質化の実験ページ</title>
<link rel="stylesheet" href="style.css">
<style>
  main.lab { display: block; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 24px; margin-bottom: 16px; }
  .controls label { display: flex; gap: 8px; align-items: center; }
  .controls input[type=range] { flex: 1; }
  .controls output { min-width: 4ch; font-variant-numeric: tabular-nums; text-align: right; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .cards.actual { grid-template-columns: repeat(auto-fit, 640px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .card h2 { font-size: 15px; margin: 0 0 6px; }
  .card canvas { width: 100%; display: block; background: #000; image-rendering: auto; }
  .cards.actual .card canvas { width: 640px; }
  .card .m { margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
</style>
</head>
<body>
<header>
  <h1>matrix-rc 高画質化の実験ページ</h1>
  <span class="note">技術検証枠 E1（設計書④-E1 5章）。機体なしで各モードを比べ、しきい値を決める。画像は PC の外に出ない。</span>
</header>

<main class="lab">
  <div class="controls">
    <label>画像 <input id="file" type="file" accept="image/*"></label>
    <label><input id="asis" type="checkbox"> 実機の JPEG をそのまま使う（縮小・再圧縮しない。元画像がないので指標は出ない）</label>
    <label>JPEG 品質 <input id="quality" type="range" min="0.1" max="1" step="0.05" value="0.5"><output id="qualityOut">0.50</output></label>
    <label>RCAS の強さ（0 が最強） <input id="sharpness" type="range" min="0" max="2" step="0.1" value="0.5"><output id="sharpnessOut">0.5</output></label>
    <label>デブロック α（段差） <input id="alpha" type="range" min="0" max="0.5" step="0.01" value="0.10"><output id="alphaOut">0.10</output></label>
    <label>デブロック β（平らさ） <input id="beta" type="range" min="0" max="0.3" step="0.01" value="0.05"><output id="betaOut">0.05</output></label>
    <label>拡大率 <select id="scale"><option value="2">2 倍（640×480）</option><option value="4">4 倍（1280×960、EASU 2 回）</option></select></label>
    <label><input id="actual" type="checkbox"> 640px 幅で表示（Retina なら等倍に近い）</label>
  </div>
  <div class="actions">
    <button id="run" disabled>処理して比べる</button>
    <button id="apply" disabled>この設定を操作画面にも使う</button>
    <span id="msg" class="note">画像を選ぶと始まります。スライダを動かすと処理し直します。</span>
  </div>
  <div id="cards" class="cards"></div>
  <p class="note">PSNR は RGB の平均二乗誤差から、SSIM は輝度に 7×7 の一様窓。どちらも元画像を出力サイズに縮めたものとの比較。処理時間は 20 回の平均（GPU の完了まで含む）。</p>
</main>

<script type="module" src="js/lab.js"></script>
</body>
</html>
